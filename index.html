<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>序列号生成器（1:1复刻VBA）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑", sans-serif;
        }
        body {
            background-color: #f0f2f5;
            padding: 40px 20px;
        }
        /* 登录面板 */
        .login-box {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            padding: 40px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-box h3 {
            margin-bottom: 25px;
            color: #333;
        }
        .login-box input {
            width: 100%;
            height: 42px;
            padding: 0 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .login-box button {
            width: 100%;
            height: 42px;
            background-color: #1677ff;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }
        /* 主功能面板 */
        .main-box {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            display: none;
        }
        .main-box h3 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .btn-wrap {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }
        .btn-wrap button {
            height: 40px;
            background-color: #00b42a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }
        .result-area {
            border-top: 1px solid #eee;
            padding-top: 25px;
            line-height: 2.2;
            font-size: 16px;
        }
        .code-line {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .copy-btn {
            padding: 4px 12px;
            background-color: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        /* 复制成功提示文字 */
        .tip-success {
            color: #00b42a;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- 登录界面 -->
    <div class="login-box" id="loginPanel">
        <h3>管理员登录</h3>
        <input type="password" id="pwdInput" placeholder="请输入管理员密码">
        <button onclick="verifyPwd()">确认登录</button>
    </div>

    <!-- 主功能界面 -->
    <div class="main-box" id="mainPanel">
        <h3>序列号生成工具（15位 | 总和固定150）</h3>
        <div class="btn-wrap">
            <button onclick="createCode('1')">2分钟有效</button>
            <button onclick="createCode('2')">10分钟有效</button>
            <button onclick="createCode('3')">1个月有效</button>
            <button onclick="createCode('4')">2个月有效</button>
            <button onclick="createCode('5')">3个月有效</button>
            <button onclick="createCode('6')">6个月有效</button>
            <button onclick="createCode('7')">1年有效</button>
            <button onclick="createCode('8')">永久有效</button>
        </div>
        <div class="result-area" id="resultPanel"></div>
    </div>

    <script>
        // 和VBA完全一致的常量定义
        const ADMIN_PWD = "080929";
        const ALL_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

        function verifyPwd() {
            let inputPwd = document.getElementById("pwdInput").value;
            if (inputPwd === ADMIN_PWD) {
                document.getElementById("loginPanel").style.display = "none";
                document.getElementById("mainPanel").style.display = "block";
            } else {
                alert("密码错误，请重新输入！");
                document.getElementById("pwdInput").value = "";
            }
        }

        // 随机字符
        function GetRandChar() {
            let idx = Math.floor(Math.random() * ALL_CHARS.length);
            return ALL_CHARS[idx];
        }

        // 字符转数值
        function Char2Num(ch) {
            ch = ch.toUpperCase();
            if (ch >= "0" && ch <= "9") {
                return parseInt(ch);
            } else if (ch >= "A" && ch <= "Z") {
                return ch.charCodeAt(0) - "A".charCodeAt(0) + 1;
            } else {
                return 0;
            }
        }

        // 数值转字符
        function Num2Char(n) {
            if (n < 0) n = 0;
            if (n > 26) n = 26;
            if (n <= 9) {
                return String(n);
            } else {
                return String.fromCharCode("A".charCodeAt(0) + n - 10);
            }
        }

        // 计算总和
        function GetSum(code) {
            let total = 0;
            for (let i = 0; i < code.length; i++) {
                total += Char2Num(code[i]);
            }
            return total;
        }

        // 核心生成函数 1:1复刻VBA
        function GenerateCode(typeNum) {
            let code = "XXXXXXXXXXXXXXX";
            code = code.substring(0, 5) + "0" + code.substring(6);
            code = code.substring(0, 10) + typeNum + code.substring(11);

            let pos6Val = Char2Num("0");
            let pos11Val = Char2Num(typeNum);
            let remainingSum = 150 - pos6Val - pos11Val;

            for (let i = 1; i <= 15; i++) {
                if (i !== 6 && i !== 11) {
                    let ch, val;
                    do {
                        ch = GetRandChar();
                        val = Char2Num(ch);
                    } while (!(remainingSum - val >= 0 && remainingSum - val <= (15 - i) * 26));

                    let arr = code.split('');
                    arr[i - 1] = ch;
                    code = arr.join('');
                    remainingSum = remainingSum - val;
                }
            }

            let totalSum = GetSum(code);
            if (totalSum !== 150) {
                let diff = 150 - totalSum;
                let arr = code.split('');
                arr[14] = Num2Char(Char2Num(arr[14]) + diff);
                code = arr.join('');
            }
            return code;
        }

        // 主生成入口
        function createCode(type) {
            let typeText = {
                "1": "2分钟有效",
                "2": "10分钟有效",
                "3": "1个月有效",
                "4": "2个月有效",
                "5": "3个月有效",
                "6": "6个月有效",
                "7": "1年有效",
                "8": "永久有效"
            }[type];

            let code = GenerateCode(type);
            let len = code.length;
            let sum = GetSum(code);
            let createTime = new Date().toLocaleString();

            let resultHtml = `
                <div class="code-line">
                    <span><strong>生成序列号：</strong>${code}</span>
                    <button class="copy-btn" onclick="copyText(this, '${code}')">复制</button>
                    <span class="tip-success" id="copyTip"></span>
                </div>
                <div><strong>生成时间：</strong>${createTime}</div>
                <div><strong>有效时限：</strong>${typeText}</div>
                <div><strong>字符总长：</strong>${len} &nbsp;&nbsp; <strong>数值总和：</strong>${sum}</div>
            `;
            document.getElementById("resultPanel").innerHTML = resultHtml;
        }

        // 复制功能 + 按钮旁提示，无弹窗
        function copyText(btn, text) {
            const tipDom = document.getElementById("copyTip");
            navigator.clipboard.writeText(text).then(() => {
                tipDom.innerText = "√ 复制成功";
                // 2秒后自动清空提示
                setTimeout(() => {
                    tipDom.innerText = "";
                }, 2000);
            }).catch(() => {
                tipDom.innerText = "复制失败";
                setTimeout(() => {
                    tipDom.innerText = "";
                }, 2000);
            });
        }
    </script>
</body>
</html>
