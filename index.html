<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>松鼠逛逛产品溯源查询</title>
    <!-- 关键：添加微信浏览器适配的meta标签 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        body {
            font-family: "Microsoft Yahei", Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 40px;
            font-size: 22px;
        }
        .search-box {
            max-width: 820px;
            margin: 0 auto 30px;
        }
        input[type="text"] {
            width: 100%;
            padding: 30px 30px;
            font-size: 32px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .trace-card {
            width: 820px;
            box-sizing: border-box;
            margin: 0 auto 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.05);
            padding: 60px;
            display: none; /* 默认隐藏，由 JS 控制显示 */
        }
        .trace-title {
            color: #2e8b57;
            font-size: 48px;
            text-align: center;
            margin: 0 0 40px;
            font-weight: 600;
            line-height: 1.3;
        }
        .trace-item {
            font-size: 40px;
            line-height: 2.5;
            margin: 15px 0;
        }
        .trace-label {
            font-weight: bold;
            color: #333;
            display: inline-block;
            min-width: 160px;
        }
        .trace-value {
            color: #555;
        }
        .report-img-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 15px;
        }
        .report-img {
            max-width: 500px;
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .report-img:hover {
            transform: scale(1.03);
        }
        .no-result {
            max-width: 900px;
            margin: 0 auto;
            color: #dc3545;
            text-align: center;
            padding: 20px 20px;
            font-size: 40px;
            background: #fff;
            border-radius: 15px;
            display: none;
        }
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            touch-action: pan-y;
        }
        .modal-content {
            max-width: 95%;
            max-height: 95%;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
        }
        .close-modal {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 48px;
            font-weight: bold;
            cursor: pointer;
        }
        .modal-nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 50%;
            color: white;
            font-size: 36px;
            text-align: center;
            line-height: 60px;
            cursor: pointer;
            transition: background-color 0.2s;
            border: none;
            outline: none;
        }
        .modal-nav-btn:hover {
            background-color: rgba(255,255,255,0.5);
        }
        .prev-btn {
            left: 30px;
        }
        .next-btn {
            right: 30px;
        }
        .modal-page-info {
            position: absolute;
            bottom: 30px;
            color: white;
            font-size: 24px;
            background-color: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
        }
        #cardsContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 加载提示样式 */
        .loading {
            max-width: 900px;
            margin: 0 auto;
            color: #0d6efd;
            text-align: center;
            padding: 40px 20px;
            font-size: 40px;
            background: #fff;
            border-radius: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="请输入商品名/编码进行搜索...">
    </div>

    <!-- 加载提示 -->
    <div class="loading" id="loading">正在加载数据，请稍候...</div>
    
    <!-- 无结果提示 -->
    <div class="no-result" id="noResult">未找到匹配的商品信息</div>

    <!-- 动态卡片将插入到此容器中 -->
    <div id="cardsContainer"></div>

    <!-- 图片预览弹窗（保持不变） -->
    <div class="img-modal" id="imgModal">
        <span class="close-modal" onclick="closeImgModal()">&times;</span>
        <button class="modal-nav-btn prev-btn" onclick="changePage(-1)">&lt;</button>
        <button class="modal-nav-btn next-btn" onclick="changePage(1)">&gt;</button>
        <div class="modal-page-info" id="pageInfo">1/1</div>
        <img class="modal-content" id="modalImg" onclick="closeImgModal()">
    </div>

    <script>
        // ==================== 配置 ====================
        // 推荐替换为Gitee地址（更兼容微信）或自己的服务器地址
        // Gitee示例：https://gitee.com/你的用户名/仓库名/raw/main/date.json
        const BASE_JSON_URL = 'https://raw.githubusercontent.com/heshengyg/Hesheng/refs/heads/main/date.json';
        // 重试次数
        const MAX_RETRY = 2;

        // ==================== 全局变量 ====================
        let products = []; // 存储产品数组
        const searchInput = document.getElementById('searchInput');
        const noResult = document.getElementById('noResult');
        const cardsContainer = document.getElementById('cardsContainer');
        const imgModal = document.getElementById('imgModal');
        const modalImg = document.getElementById('modalImg');
        const pageInfo = document.getElementById('pageInfo');
        const loading = document.getElementById('loading');
        let currentImgGroup = null;
        let currentIndex = 0;
        const SWIPE_THRESHOLD = 50;
        let touchStartX = 0;

        // ==================== 加载数据（增强版：支持重试+跨域兼容）====================
        async function loadProducts(retryCount = 0) {
            try {
                loading.style.display = 'block';
                noResult.style.display = 'none';
                
                // 生成唯一参数，彻底避免缓存
                const timestamp = Date.now() + Math.random();
                const url = `${BASE_JSON_URL}?_t=${timestamp}`;
                
                // 配置fetch参数，增强跨域兼容性
                const fetchOptions = {
                    method: 'GET',
                    mode: 'cors', // 显式指定跨域模式
                    cache: 'no-cache', // 强制不缓存
                    headers: {
                        'Accept': 'application/json',
                        'Cache-Control': 'no-cache'
                    }
                };

                const response = await fetch(url, fetchOptions);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // 检查数据结构
                if (!data.products || !Array.isArray(data.products)) {
                    throw new Error('JSON 数据格式错误：缺少 products 数组');
                }
                
                products = data.products;
                loading.style.display = 'none';
                
                // 处理URL参数
                handleUrlSearch();
            } catch (error) {
                console.error('加载产品数据失败：', error);
                
                // 重试机制
                if (retryCount < MAX_RETRY) {
                    console.log(`重试加载 (${retryCount + 1}/${MAX_RETRY})...`);
                    setTimeout(() => loadProducts(retryCount + 1), 1000);
                    return;
                }
                
                // 最终失败提示（适配微信）
                loading.style.display = 'none';
                noResult.innerHTML = `
                    数据加载失败：${error.message}<br>
                    建议：<br>
                    1. 刷新页面重试<br>
                    2. 复制链接到手机浏览器打开<br>
                    3. 检查JSON地址是否正确
                `;
                noResult.style.display = 'block';
            }
        }

        // ==================== 渲染卡片（内部使用）====================
        function renderCards(productsToRender) {
            if (!Array.isArray(productsToRender)) {
                console.error('renderCards 参数不是数组', productsToRender);
                noResult.innerHTML = '内部错误：产品数据格式异常，无法显示。';
                noResult.style.display = 'block';
                loading.style.display = 'none';
                return;
            }
            cardsContainer.innerHTML = ''; // 清空容器
            productsToRender.forEach(product => {
                const card = createCard(product);
                cardsContainer.appendChild(card);
            });
            // 将所有新卡片设置为可见
            document.querySelectorAll('.trace-card').forEach(card => {
                card.style.display = 'block';
            });
        }

        // ==================== 根据产品对象创建卡片 DOM ====================
        function createCard(product) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'trace-card';
            cardDiv.dataset.code = product.code;

            // 使用 product.reportImages 字段（与 JSON 一致）
            const images = product.reportImages || [];
            let imagesHtml = '';
            images.forEach((imgUrl, index) => {
                imagesHtml += `<img class="report-img" src="${imgUrl}" alt="${product.name}检测报告${index+1}" onclick="openImgModal(this.parentElement, ${index})">`;
            });

            cardDiv.innerHTML = `
                <h2 class="trace-title">${product.title}</h2>
                <div class="trace-item"><span class="trace-label">蔬菜名称：</span><span class="trace-value">${product.name}</span></div>
                <div class="trace-item"><span class="trace-label">产地：</span><span class="trace-value">${product.origin}</span></div>
                <div class="trace-item"><span class="trace-label">供应商：</span><span class="trace-value">${product.supplier}</span></div>
                <div class="trace-item"><span class="trace-label">保质期：</span><span class="trace-value">${product.shelfLife}</span></div>
                <div class="trace-item">
                    <span class="trace-label">检测报告：</span>
                    <div class="report-img-group" data-imgs='${JSON.stringify(images)}'>
                        ${imagesHtml}
                    </div>
                </div>
            `;
            return cardDiv;
        }

        // ==================== 解析 URL 参数 ====================
        function getUrlParam(name) {
            const params = new URL(window.location.href).searchParams;
            const value = params.get(name);
            return value ? value.trim() : '';
        }

        // ==================== 根据 URL 参数执行搜索 ====================
        function handleUrlSearch() {
            const code = getUrlParam('code');
            if (code) {
                searchInput.value = code;
                handleSearch(code);
            } else {
                // 没有参数时，确保容器为空，不显示任何卡片
                cardsContainer.innerHTML = '';
                noResult.style.display = 'none';
            }
        }

        // ==================== 核心搜索函数 ====================
        function handleSearch(filter) {
            loading.style.display = 'none';
            
            if (!Array.isArray(products) || products.length === 0) {
                return;
            }

            if (!filter || filter.trim() === '') {
                cardsContainer.innerHTML = '';
                noResult.style.display = 'none';
                return;
            }

            const lowerFilter = filter.toLowerCase().trim();
            const matchedProducts = products.filter(product => {
                return product.name.toLowerCase().includes(lowerFilter) ||
                       product.code.toLowerCase().includes(lowerFilter);
            });

            if (matchedProducts.length > 0) {
                renderCards(matchedProducts);
                noResult.style.display = 'none';
                // 如果输入的是精确编码，滚动到第一个匹配卡片
                if (matchedProducts.some(p => p.code.toLowerCase() === lowerFilter)) {
                    const firstCard = cardsContainer.querySelector('.trace-card');
                    if (firstCard) firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            } else {
                cardsContainer.innerHTML = ''; // 清空卡片
                noResult.innerHTML = '未找到匹配的商品信息';
                noResult.style.display = 'block';
            }
        }

        // ==================== 图片预览相关函数 ====================
        window.openImgModal = function(imgGroup, index) {
            currentImgGroup = JSON.parse(imgGroup.dataset.imgs);
            currentIndex = index;
            updateModalContent();
            imgModal.style.display = 'flex';
        }

        window.closeImgModal = function() {
            imgModal.style.display = 'none';
            currentImgGroup = null;
            currentIndex = 0;
        }

        function updateModalContent() {
            if (!currentImgGroup || currentImgGroup.length === 0) return;
            modalImg.src = currentImgGroup[currentIndex];
            pageInfo.textContent = `${currentIndex + 1}/${currentImgGroup.length}`;
            document.querySelector('.prev-btn').style.display = currentImgGroup.length > 1 ? 'block' : 'none';
            document.querySelector('.next-btn').style.display = currentImgGroup.length > 1 ? 'block' : 'none';
        }

        window.changePage = function(step) {
            if (!currentImgGroup || currentImgGroup.length <= 1) return;
            currentIndex += step;
            if (currentIndex < 0) currentIndex = currentImgGroup.length - 1;
            else if (currentIndex >= currentImgGroup.length) currentIndex = 0;
            updateModalContent();
        }

        // ==================== 滑动事件监听 ====================
        modalImg.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        });
        modalImg.addEventListener('mousedown', e => {
            touchStartX = e.screenX;
        });
        modalImg.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].screenX;
            handleSwipe(touchEndX);
        });
        modalImg.addEventListener('mouseup', e => {
            handleSwipe(e.screenX);
        });
        modalImg.addEventListener('mouseleave', e => {
            // 可选：鼠标离开时不触发翻页
        });

        function handleSwipe(touchEndX) {
            const swipeDiff = touchStartX - touchEndX;
            if (swipeDiff > SWIPE_THRESHOLD) {
                changePage(1);
            } else if (swipeDiff < -SWIPE_THRESHOLD) {
                changePage(-1);
            }
        }

        // ==================== 点击模态框背景关闭 ====================
        imgModal.addEventListener('click', e => {
            if (e.target === imgModal) closeImgModal();
        });

        // ==================== 监听输入事件 ====================
        searchInput.addEventListener('input', function() {
            handleSearch(this.value.trim());
        });

        // ==================== 微信浏览器特殊处理 ====================
        // 页面加载完成后执行
        window.addEventListener('load', function() {
            // 强制刷新微信缓存（仅在微信环境下）
            if (/MicroMessenger/i.test(navigator.userAgent)) {
                console.log('检测到微信浏览器，执行缓存清理');
                // 清除当前页面缓存
                window.location.href = window.location.href + (window.location.search ? '&' : '?') + 'v=' + Date.now();
            }
        });

        // ==================== 启动加载 ====================
        // 延迟加载，适配微信初始化
        setTimeout(() => loadProducts(), 500);
    </script>
</body>
</html>
